name: Install PowerShell using pwsh-setup-action

on: push

jobs:
  install-pwsh:
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up PowerShell
        uses: msfjarvis/pwsh-setup-action@v1

      - name: Verify PowerShell Installation
        run: pwsh --version

      - name: Run PowerShell Script
        run: pwsh -Command "Write-Host 'PowerShell is installed and working!'"
